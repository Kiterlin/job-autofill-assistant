<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星河科技 2026 校园招聘 · 网申表单</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }
    .hero {
      background: linear-gradient(120deg, #0f172a, #1d4ed8 55%, #0ea5e9);
      color: #fff;
      padding: 28px 48px 36px;
    }
    .hero-kicker { opacity: .8; font-size: 13px; letter-spacing: .08em; }
    .hero h1 { margin: 8px 0 6px; font-size: 28px; font-weight: 700; }
    .hero p { margin: 0; opacity: .9; }
    .wrap { max-width: 1080px; margin: -18px auto 48px; padding: 0 24px; }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, .08);
      padding: 24px 28px 8px;
      margin-bottom: 18px;
    }
    h2 { margin: 0 0 16px; font-size: 16px; color: #0f172a; border-left: 3px solid #2563eb; padding-left: 10px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
    label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; }
    input, select {
      width: 100%;
      height: 38px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 14px;
      background: #f8fafc;
    }
    .field { margin-bottom: 16px; }
    footer { text-align: center; color: #94a3b8; font-size: 12px; padding: 8px 0 32px; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-kicker">CAMPUS RECRUITING 2026</div>
    <h1>星河科技 · 校园招聘网申</h1>
    <p>后端开发工程师（校招） · 北京 / 上海 / 深圳</p>
  </header>
  <main class="wrap">
    <section class="card">
      <h2>基本信息</h2>
      <div class="grid">
        <div class="field"><label>姓名</label><input type="text" name="fullName"></div>
        <div class="field"><label>手机号码</label><input type="tel" name="phone"></div>
        <div class="field"><label>电子邮箱</label><input type="email" name="email"></div>
        <div class="field"><label>性别</label><input type="text" name="gender"></div>
        <div class="field"><label>出生日期</label><input type="text" name="birthDate"></div>
        <div class="field"><label>政治面貌</label><input type="text" name="politicalStatus"></div>
        <div class="field"><label>民族</label><input type="text" name="ethnicity"></div>
        <div class="field"><label>籍贯</label><input type="text" name="hometown"></div>
        <div class="field"><label>婚姻状况</label><input type="text" name="maritalStatus"></div>
        <div class="field"><label>现居住城市</label><input type="text" name="currentCity"></div>
        <div class="field"><label>期望岗位</label><input type="text" name="expectedPosition"></div>
        <div class="field"><label>招聘渠道</label><input type="text" name="recruitSource"></div>
      </div>
    </section>
    <section class="card">
      <h2>教育背景</h2>
      <div class="grid">
        <div class="field"><label>毕业院校</label><input type="text" name="school"></div>
        <div class="field"><label>所学专业</label><input type="text" name="major"></div>
        <div class="field"><label>最高学历</label><input type="text" name="degree"></div>
        <div class="field"><label>院校层次</label><input type="text" name="schoolType"></div>
        <div class="field"><label>英语四级</label><input type="text" name="cet4"></div>
        <div class="field"><label>英语六级</label><input type="text" name="cet6"></div>
      </div>
    </section>
    <section class="card">
      <h2>家庭成员</h2>
      <div class="grid">
        <div class="field"><label>家庭成员姓名</label><input type="text" name="familyName"></div>
        <div class="field"><label>亲属关系</label><input type="text" name="familyRelation"></div>
        <div class="field"><label>家庭成员工作单位</label><input type="text" name="familyEmployer"></div>
        <div class="field"><label>家庭成员职务</label><input type="text" name="familyPosition"></div>
        <div class="field"><label>家庭成员电话</label><input type="tel" name="familyPhone"></div>
      </div>
    </section>
  </main>
  <footer>演示页面，仅用于 README 截图</footer>
</body>
</html>
